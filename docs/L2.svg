@startuml





skinparam defaultTextAlignment center

skinparam wrapWidth 200
skinparam maxMessageSize 150

skinparam rectangle {
    StereotypeFontSize 12
    shadowing false
}

skinparam database {
    StereotypeFontSize 12
    shadowing false
}

skinparam Arrow {
    Color #666666
    FontColor #666666
    FontSize 12
}

skinparam rectangle<<boundary>> {
    Shadowing false
    StereotypeFontSize 0
    FontColor #444444
    BorderColor #444444
    BorderStyle dashed
}






















skinparam rectangle<<person>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #08427B
    BorderColor #073B6F
}

skinparam rectangle<<external_person>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #686868
    BorderColor #8A8A8A
}

skinparam rectangle<<system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #1168BD
    BorderColor #3C7FC0
}

skinparam rectangle<<external_system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #999999
    BorderColor #8A8A8A
}

skinparam database<<system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #1168BD
    BorderColor #3C7FC0
}

skinparam database<<external_system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #999999
    BorderColor #8A8A8A
}
















skinparam rectangle<<container>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #438DD5
    BorderColor #3C7FC0
}

skinparam database<<container>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #438DD5
    BorderColor #3C7FC0
}








rectangle "==Пользователь / Администратор\n\n Пользователи системы" <<person>> as user

rectangle "==TimeTracker\n<size:12>[System]</size>" <<boundary>> as time_tracker_system {

    rectangle "==Android Приложение (App)\n//<size:12>[Kotlin, Jetpack Compose]</size>//\n\n Обеспечивает графический интерфейс для мобильных устройств." <<container>> as app

    rectangle "==Технологический UI (CLI)\n//<size:12>[Kotlin JVM]</size>//\n\n Обеспечивает консольный интерфейс на ПК и Android." <<container>> as tech_ui

    database "==Локальная БД\n//<size:12>[SQLite (Room), ObjectBox]</size>//\n\n Хранит категории, записи времени и настройки пользователя." <<container>> as local_db
}

user - -> app : "===Взаимодействует с GUI\n//<size:12>[Android UI]</size>//"
user - -> tech_ui : "===Вводит команды\n//<size:12>[CLI]</size>//"

app - -> local_db : "===Читает и записывает данные\n//<size:12>[ObjectBox / Room]</size>//"
tech_ui - -> local_db : "===Читает и записывает данные\n//<size:12>[SQL / Room]</size>//"

@enduml

