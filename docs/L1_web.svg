@startuml





skinparam defaultTextAlignment center

skinparam wrapWidth 200
skinparam maxMessageSize 150

skinparam rectangle {
    StereotypeFontSize 12
    shadowing false
}

skinparam database {
    StereotypeFontSize 12
    shadowing false
}

skinparam Arrow {
    Color #666666
    FontColor #666666
    FontSize 12
}

skinparam rectangle<<boundary>> {
    Shadowing false
    StereotypeFontSize 0
    FontColor #444444
    BorderColor #444444
    BorderStyle dashed
}






















skinparam rectangle<<person>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #08427B
    BorderColor #073B6F
}

skinparam rectangle<<external_person>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #686868
    BorderColor #8A8A8A
}

skinparam rectangle<<system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #1168BD
    BorderColor #3C7FC0
}

skinparam rectangle<<external_system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #999999
    BorderColor #8A8A8A
}

skinparam database<<system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #1168BD
    BorderColor #3C7FC0
}

skinparam database<<external_system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #999999
    BorderColor #8A8A8A
}












rectangle "==Пользователь\n\n Основной пользователь веб-системы. Фиксирует время, управляет личными категориями, анализирует статистику." <<person>> as user
rectangle "==Администратор\n\n Привилегированный пользователь. Управляет глобальными базовыми категориями и конфигурацией системы." <<person>> as admin

rectangle "==TimeTracker Web System\n\n Распределенная веб-система для учета, категоризации и аналитики персонального времени." <<system>> as time_tracker_web

user - -> time_tracker_web : "===Отслеживает время через Web SPA / API / TUI\n//<size:12>[HTTPS / REST]</size>//"
admin - -> time_tracker_web : "===Администрирует базовые категории, следит за мониторингом\n//<size:12>[HTTPS / REST]</size>//"

@enduml

