openapi: 3.1.0
info:
  title: TimeTracker REST API
  description: |
    REST API сервиса учета времени и продуктивности TimeTracker.

    Основные возможности:
    * Учетные записи и роли пользователей (USER, ADMIN)
    * Управление категориями активностей (системные и пользовательские)
    * Запуск и остановка сессий таймера
    * Создание и учет записей времени с контролем пересечений интервалов
    * Фильтрация, полное и частичное обновление записей
    * Аудит истории изменений описания и восстановление предыдущих версий
  version: 1.0.0
  contact:
    name: TimeTracker Support
    email: support@timetracker.local
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки
  - url: http://localhost:80
    description: Шлюз Nginx

tags:
  - name: Auth
    description: Аутентификация и профиль пользователя
  - name: Categories
    description: Управление категориями активностей
  - name: Timer
    description: Управление активным таймером
  - name: Records
    description: Управление записями времени
  - name: History
    description: История изменений описания записей

paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация нового пользователя
      description: Создает нового пользователя в системе и возвращает токен доступа.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
            examples:
              newUser:
                summary: Регистрация обычного пользователя
                value:
                  login: "alex_dev"
                  name: "Алексей Смирнов"
                  password: "securePassword123"
                  role: "USER"
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  value:
                    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    user:
                      id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      login: "alex_dev"
                      name: "Алексей Смирнов"
                      role: "USER"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Пользователь с таким логином уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateLogin:
                  value:
                    code: "USER_ALREADY_EXISTS"
                    message: "Пользователь с логином 'alex_dev' уже существует"
                    timestamp: "2026-10-15T10:00:00Z"

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Аутентификация пользователя
      description: Проверяет учетные данные и возвращает JWT токен доступа.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
            examples:
              validCredentials:
                summary: Корректные учетные данные
                value:
                  login: "alex_dev"
                  password: "securePassword123"
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  value:
                    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    user:
                      id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      login: "alex_dev"
                      name: "Алексей Смирнов"
                      role: "USER"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCreds:
                  value:
                    code: "INVALID_CREDENTIALS"
                    message: "Неверный логин или пароль"
                    timestamp: "2026-10-15T10:00:00Z"

  /api/v1/users/me:
    get:
      tags:
        - Auth
      summary: Получение данных текущего пользователя
      description: Возвращает профиль аутентифицированного пользователя по переданному Bearer токену.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Данные текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                me:
                  value:
                    id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    login: "alex_dev"
                    name: "Алексей Смирнов"
                    role: "USER"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/categories:
    get:
      tags:
        - Categories
      summary: Список доступных категорий
      description: Возвращает список базовых категорий системы и личных категорий текущего пользователя.
      operationId: listCategories
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          description: Фильтр области видимости категорий
          schema:
            type: string
            enum: [all, default, custom]
            default: all
            examples:
              - all
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              examples:
                categoriesList:
                  value:
                    - id: "11111111-1111-1111-1111-111111111111"
                      userId: null
                      name: "Работа / Проекты"
                      colorHex: "#3B82F6"
                      isDefault: true
                    - id: "22222222-2222-2222-2222-222222222222"
                      userId: null
                      name: "Спорт и здоровье"
                      colorHex: "#10B981"
                      isDefault: true
                    - id: "33333333-3333-3333-3333-333333333333"
                      userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      name: "Чтение книг"
                      colorHex: "#8B5CF6"
                      isDefault: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Categories
      summary: Создание новой категории
      description: |
        Создает категорию.
        * Обычный пользователь создает личную категорию (`isDefault: false`, `userId` устанавливается автоматически).
        * Создание базовой категории (`isDefault: true`) разрешено только пользователям с ролью `ADMIN`.
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
            examples:
              userCategory:
                summary: Создание личной категории
                value:
                  name: "Чтение книг"
                  colorHex: "#8B5CF6"
                  isDefault: false
              baseCategoryAdmin:
                summary: Создание базовой категории администратором
                value:
                  name: "Учеба и курсы"
                  colorHex: "#F59E0B"
                  isDefault: true
      responses:
        '201':
          description: Категория успешно создана
          headers:
            Location:
              description: Ссылка на созданный ресурс
              schema:
                type: string
                examples:
                  - "/api/v1/categories/33333333-3333-3333-3333-333333333333"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              examples:
                created:
                  value:
                    id: "33333333-3333-3333-3333-333333333333"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Чтение книг"
                    colorHex: "#8B5CF6"
                    isDefault: false
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Категория с таким именем уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateCategory:
                  value:
                    code: "CATEGORY_ALREADY_EXISTS"
                    message: "Категория с названием 'Чтение книг' уже существует"
                    timestamp: "2026-10-15T10:00:00Z"

  /api/v1/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryIdParam'

    get:
      tags:
        - Categories
      summary: Получение категории по ID
      description: Возвращает данные категории по ее уникальному идентификатору.
      operationId: getCategoryById
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Категория найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              examples:
                category:
                  value:
                    id: "33333333-3333-3333-3333-333333333333"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Чтение книг"
                    colorHex: "#8B5CF6"
                    isDefault: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Categories
      summary: Полное обновление категории (PUT)
      description: |
        Полная замена всех полей категории (идемпотентная операция).
        Личные категории может изменять только владелец; базовые категории — только администратор.
      operationId: updateCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
            examples:
              update:
                value:
                  name: "Чтение научной литературы"
                  colorHex: "#7C3AED"
      responses:
        '200':
          description: Категория успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              examples:
                updated:
                  value:
                    id: "33333333-3333-3333-3333-333333333333"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Чтение научной литературы"
                    colorHex: "#7C3AED"
                    isDefault: false
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Конфликт уникальности названия категории
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Categories
      summary: Частичное обновление категории
      description: |
        Частичное изменение параметров категории (название или цвет).
      operationId: patchCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatchRequest'
            examples:
              patchColorOnly:
                summary: Обновление только цвета категории
                value:
                  colorHex: "#9333EA"
              patchNameOnly:
                summary: Обновление только названия категории
                value:
                  name: "Хобби и чтение"
      responses:
        '200':
          description: Категория успешно частично обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              examples:
                patched:
                  value:
                    id: "33333333-3333-3333-3333-333333333333"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Хобби и чтение"
                    colorHex: "#8B5CF6"
                    isDefault: false
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Categories
      summary: Удаление категории
      description: |
        Удаляет категорию. Базовые категории может удалять только `ADMIN`. Личные — только создавший пользователь.
        При удалении связанные записи времени каскадно обновляются/удаляются согласно правилам целостности.
      operationId: deleteCategory
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Категория успешно удалена (нет содержимого)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/timer/active:
    get:
      tags:
        - Timer
      summary: Получение текущей активной сессии таймера
      description: |
        Возвращает данные о запущенном таймере текущего пользователя.
        Если активный таймер отсутствует, возвращается статус 204 No Content.
      operationId: getActiveTimer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Активная сессия таймера найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveTimerSession'
              examples:
                active:
                  value:
                    recordId: "44444444-4444-4444-4444-444444444444"
                    categoryId: "11111111-1111-1111-1111-111111111111"
                    categoryName: "Работа / Проекты"
                    colorHex: "#3B82F6"
                    startTime: "2026-10-15T10:00:00Z"
                    elapsedSeconds: 2538
        '204':
          description: Активный таймер отсутствует
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/timer/start:
    post:
      tags:
        - Timer
      summary: Запуск таймера
      description: |
        Запускает сессию таймера для указанной категории.
        У пользователя может быть не более одной активной сессии одновременно.
      operationId: startTimer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTimerRequest'
            examples:
              startSession:
                value:
                  categoryId: "11111111-1111-1111-1111-111111111111"
      responses:
        '201':
          description: Таймер успешно запущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveTimerSession'
              examples:
                started:
                  value:
                    recordId: "44444444-4444-4444-4444-444444444444"
                    categoryId: "11111111-1111-1111-1111-111111111111"
                    categoryName: "Работа / Проекты"
                    colorHex: "#3B82F6"
                    startTime: "2026-10-15T10:00:00Z"
                    elapsedSeconds: 0
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Указанная категория не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                categoryNotFound:
                  value:
                    code: "CATEGORY_NOT_FOUND"
                    message: "Категория с ID '11111111-1111-1111-1111-111111111111' не найдена"
                    timestamp: "2026-10-15T10:00:00Z"
        '409':
          description: У пользователя уже есть активный таймер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                timerConflict:
                  value:
                    code: "TIMER_ALREADY_ACTIVE"
                    message: "У вас уже запущена сессия таймера для категории 'Работа / Проекты'"
                    timestamp: "2026-10-15T10:00:00Z"

  /api/v1/timer/stop:
    post:
      tags:
        - Timer
      summary: Остановка активного таймера
      description: |
        Останавливает активный таймер. Если длительность сессии составляет 1 минуту и более, создается запись времени со статусом SAVED. Если менее 1 минуты — сессия завершается со статусом DISCARDED без сохранения в базу данных.
      operationId: stopTimer
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopTimerRequest'
            examples:
              stopWithDesc:
                value:
                  description: "Проектирование спецификации OpenAPI 3.1"
      responses:
        '200':
          description: Таймер успешно остановлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopTimerResponse'
              examples:
                savedRecord:
                  summary: Сессия успешно сохранена
                  value:
                    status: "SAVED"
                    message: "Сессия таймера успешно сохранена"
                    record:
                      id: "44444444-4444-4444-4444-444444444444"
                      userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      categoryId: "11111111-1111-1111-1111-111111111111"
                      startTime: "2026-10-15T10:00:00Z"
                      endTime: "2026-10-15T10:45:00Z"
                      description: "Проектирование спецификации OpenAPI 3.1"
                discardedRecord:
                  summary: Сессия отброшена (< 1 мин)
                  value:
                    status: "DISCARDED"
                    message: "Сессия длительностью менее 1 минуты отброшена без сохранения"
                    record: null
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Нет активной сессии таймера для остановки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noTimer:
                  value:
                    code: "NO_ACTIVE_TIMER"
                    message: "У вас нет запущенного таймера"
                    timestamp: "2026-10-15T10:00:00Z"

  /api/v1/records:
    get:
      tags:
        - Records
      summary: Список записей времени с фильтрацией и пагинацией
      description: Возвращает хронологический перечень записей времени текущего пользователя с поддержкой фильтрации по датам и категории.
      operationId: listRecords
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Начальная дата/время фильтра (ISO-8601)
          schema:
            type: string
            format: date-time
            examples:
              - "2026-10-15T00:00:00Z"
        - name: to
          in: query
          required: false
          description: Конечная дата/время фильтра (ISO-8601)
          schema:
            type: string
            format: date-time
            examples:
              - "2026-10-15T23:59:59Z"
        - name: categoryId
          in: query
          required: false
          description: Фильтр по ID категории
          schema:
            type: string
            format: uuid
            examples:
              - "11111111-1111-1111-1111-111111111111"
        - name: limit
          in: query
          required: false
          description: Максимальное количество записей на страницу
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            examples:
              - 20
        - name: offset
          in: query
          required: false
          description: Смещение выборки для пагинации
          schema:
            type: integer
            minimum: 0
            default: 0
            examples:
              - 0
      responses:
        '200':
          description: Список записей времени
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecordsResponse'
              examples:
                records:
                  value:
                    items:
                      - id: "44444444-4444-4444-4444-444444444444"
                        userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        categoryId: "11111111-1111-1111-1111-111111111111"
                        startTime: "2026-10-15T10:00:00Z"
                        endTime: "2026-10-15T10:45:00Z"
                        description: "Проектирование спецификации OpenAPI 3.1"
                      - id: "55555555-5555-5555-5555-555555555555"
                        userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        categoryId: "22222222-2222-2222-2222-222222222222"
                        startTime: "2026-10-15T12:00:00Z"
                        endTime: "2026-10-15T12:45:00Z"
                        description: "Бег в парке"
                    total: 2
                    limit: 20
                    offset: 0
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Records
      summary: Создание записи времени
      description: |
        Создает запись времени с указанием интервала начала и окончания.
        Ограничения:
        * Время начала строго меньше времени окончания.
        * Минимальная длительность записи — 1 минута.
        * Интервал не должен пересекаться с существующими записями пользователя.
      operationId: createRecord
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeRecordCreateRequest'
            examples:
              manualRecord:
                value:
                  categoryId: "11111111-1111-1111-1111-111111111111"
                  startTime: "2026-10-15T14:00:00Z"
                  endTime: "2026-10-15T15:30:00Z"
                  description: "Разработка API контроллеров и тестов"
      responses:
        '201':
          description: Запись времени успешно создана
          headers:
            Location:
              description: Ссылка на созданную запись
              schema:
                type: string
                examples:
                  - "/api/v1/records/66666666-6666-6666-6666-666666666666"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecord'
              examples:
                created:
                  value:
                    id: "66666666-6666-6666-6666-666666666666"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    categoryId: "11111111-1111-1111-1111-111111111111"
                    startTime: "2026-10-15T14:00:00Z"
                    endTime: "2026-10-15T15:30:00Z"
                    description: "Разработка API контроллеров и тестов"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Категория не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Обнаружено пересечение с существующей записью времени
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                overlap:
                  value:
                    code: "TIME_INTERVAL_OVERLAP"
                    message: "Интервал с 14:00 до 15:30 пересекается с существующей записью '44444444-4444-4444-4444-444444444444' (14:30 - 15:00)"
                    timestamp: "2026-10-15T10:00:00Z"
        '422':
          description: Некорректный интервал времени (T_start >= T_end или длительность менее 1 мин)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInterval:
                  value:
                    code: "INVALID_TIME_RANGE"
                    message: "Время окончания должно быть строго позже времени начала"
                    timestamp: "2026-10-15T10:00:00Z"

  /api/v1/records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/RecordIdParam'

    get:
      tags:
        - Records
      summary: Получение записи времени по ID
      description: Возвращает данные конкретной записи времени. Доступ разрешен только владельцу записи.
      operationId: getRecordById
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Запись времени найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecord'
              examples:
                record:
                  value:
                    id: "44444444-4444-4444-4444-444444444444"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    categoryId: "11111111-1111-1111-1111-111111111111"
                    startTime: "2026-10-15T10:00:00Z"
                    endTime: "2026-10-15T10:45:00Z"
                    description: "Проектирование спецификации OpenAPI 3.1"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Records
      summary: Полное обновление записи времени (PUT)
      description: |
        Полная замена полей записи времени (идемпотентная операция).
        При изменении описания старый текст архивируется в историю версий.
      operationId: updateRecord
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeRecordUpdateRequest'
            examples:
              fullUpdate:
                value:
                  categoryId: "11111111-1111-1111-1111-111111111111"
                  startTime: "2026-10-15T10:00:00Z"
                  endTime: "2026-10-15T11:00:00Z"
                  description: "Проектирование спецификации OpenAPI 3.1 и ревью методов"
      responses:
        '200':
          description: Запись времени успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecord'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Обновление вызвало наложение интервалов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Records
      summary: Частичное обновление записи времени (PATCH)
      description: |
        Частичное изменение полей записи (например, только текста описания).
        При изменении поля description система автоматически сохраняет предыдущее значение в таблице time_record_history.
      operationId: patchRecord
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeRecordPatchRequest'
            examples:
              updateDescriptionOnly:
                summary: Изменение только текста описания
                value:
                  description: "Подготовка ТЗ и согласование контракта REST API"
              changeCategoryOnly:
                summary: Изменение только категории
                value:
                  categoryId: "22222222-2222-2222-2222-222222222222"
      responses:
        '200':
          description: Запись времени успешно частично обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecord'
              examples:
                updated:
                  value:
                    id: "44444444-4444-4444-4444-444444444444"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    categoryId: "11111111-1111-1111-1111-111111111111"
                    startTime: "2026-10-15T10:00:00Z"
                    endTime: "2026-10-15T10:45:00Z"
                    description: "Подготовка ТЗ и согласование контракта REST API"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Конфликт интервалов при изменении дат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Records
      summary: Удаление записи времени
      description: Удаляет запись времени и связанные исторические версии описания (каскадно).
      operationId: deleteRecord
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Запись успешно удалена
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/records/{recordId}/history:
    parameters:
      - $ref: '#/components/parameters/RecordIdParam'

    get:
      tags:
        - History
      summary: Просмотр истории версий описания записи
      description: Возвращает хронологический перечень всех предыдущих редакций описания указанной записи времени.
      operationId: getDescriptionHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: История изменений описания получена
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DescriptionVersion'
              examples:
                historyList:
                  value:
                    - id: "77777777-7777-7777-7777-777777777777"
                      recordId: "44444444-4444-4444-4444-444444444444"
                      description: "Проектирование архитектуры и C4"
                      modifiedAt: "2026-10-15T10:20:00Z"
                    - id: "88888888-8888-8888-8888-888888888888"
                      recordId: "44444444-4444-4444-4444-444444444444"
                      description: "Учеба"
                      modifiedAt: "2026-10-15T10:05:00Z"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/records/{recordId}/history/{versionId}/rollback:
    parameters:
      - $ref: '#/components/parameters/RecordIdParam'
      - name: versionId
        in: path
        required: true
        description: Уникальный идентификатор исторической версии описания для отката
        schema:
          type: string
          format: uuid
          examples:
            - "88888888-8888-8888-8888-888888888888"

    post:
      tags:
        - History
      summary: Восстановление описания записи из истории
      description: |
        Восстанавливает описание записи из указанной исторической версии.
        Текущее описание сохраняется в историю как новый снимок перед применением изменений.
      operationId: rollbackDescription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Описание успешно откачено к версии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecord'
              examples:
                restoredRecord:
                  value:
                    id: "44444444-4444-4444-4444-444444444444"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    categoryId: "11111111-1111-1111-1111-111111111111"
                    startTime: "2026-10-15T10:00:00Z"
                    endTime: "2026-10-15T10:45:00Z"
                    description: "Учеба"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Запись или указанная версия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                versionNotFound:
                  value:
                    code: "VERSION_NOT_FOUND"
                    message: "Версия описания с ID '88888888-8888-8888-8888-888888888888' не найдена для данной записи"
                    timestamp: "2026-10-15T10:00:00Z"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен авторизации в формате `Bearer <token>`

  parameters:
    CategoryIdParam:
      name: categoryId
      in: path
      required: true
      description: Уникальный идентификатор категории
      schema:
        type: string
        format: uuid
        examples:
          - "33333333-3333-3333-3333-333333333333"

    RecordIdParam:
      name: recordId
      in: path
      required: true
      description: Уникальный идентификатор записи времени
      schema:
        type: string
        format: uuid
        examples:
          - "44444444-4444-4444-4444-444444444444"

  responses:
    BadRequestError:
      description: Некорректный синтаксис запроса или ошибка валидации полей
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              value:
                code: "BAD_REQUEST"
                message: "Некорректный формат входных данных"
                timestamp: "2026-10-15T10:00:00Z"

    UnauthorizedError:
      description: Отсутствует или недействителен токен авторизации (Bearer JWT)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                code: "UNAUTHORIZED"
                message: "Требуется авторизация в системе"
                timestamp: "2026-10-15T10:00:00Z"

    ForbiddenError:
      description: Недостаточно прав для выполнения операции (например, попытка изменения чужой записи или создание базовой категории без роли ADMIN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                code: "FORBIDDEN"
                message: "Недостаточно прав для выполнения действия"
                timestamp: "2026-10-15T10:00:00Z"

    NotFoundError:
      description: Запрашиваемый ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                code: "RESOURCE_NOT_FOUND"
                message: "Запрашиваемый ресурс не найден"
                timestamp: "2026-10-15T10:00:00Z"

  schemas:
    User:
      type: object
      required:
        - id
        - login
        - name
        - role
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор пользователя
          examples:
            - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        login:
          type: string
          minLength: 3
          maxLength: 50
          description: Уникальный логин пользователя
          examples:
            - "alex_dev"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Отображаемое имя пользователя
          examples:
            - "Алексей Смирнов"
        role:
          type: string
          enum: [USER, ADMIN]
          description: Роль пользователя в системе
          examples:
            - "USER"

    UserRegistrationRequest:
      type: object
      required:
        - login
        - name
        - password
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-zA-Z0-9_.-]+$"
          description: Логин (латиница, цифры, дефис, точка)
          examples:
            - "alex_dev"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Имя пользователя
          examples:
            - "Алексей Смирнов"
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 128
          description: Пароль учетной записи
          examples:
            - "securePassword123"
        role:
          type: string
          enum: [USER, ADMIN]
          default: USER
          description: Желаемая роль пользователя (по умолчанию USER)
          examples:
            - "USER"

    UserLoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          description: Логин пользователя
          examples:
            - "alex_dev"
        password:
          type: string
          format: password
          minLength: 1
          description: Пароль пользователя
          examples:
            - "securePassword123"

    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: JWT Access Token для авторизации последующих запросов
          examples:
            - "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/User'

    Category:
      type: object
      required:
        - id
        - name
        - colorHex
        - isDefault
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор категории
          examples:
            - "33333333-3333-3333-3333-333333333333"
        userId:
          type:
            - string
            - "null"
          format: uuid
          description: Идентификатор владельца (null для глобальных базовых категорий)
          examples:
            - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Название категории
          examples:
            - "Чтение книг"
        colorHex:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Цвет категории в формате HEX (#RRGGBB)
          examples:
            - "#8B5CF6"
        isDefault:
          type: boolean
          description: Признак базовой категории системы
          examples:
            - false

    CategoryCreateRequest:
      type: object
      required:
        - name
        - colorHex
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Название категории
          examples:
            - "Чтение книг"
        colorHex:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Цвет категории в формате HEX (#RRGGBB)
          examples:
            - "#8B5CF6"
        isDefault:
          type: boolean
          default: false
          description: Флаг базовой категории (разрешено устанавливать в true только администраторам)
          examples:
            - false

    CategoryUpdateRequest:
      type: object
      required:
        - name
        - colorHex
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Новое название категории
          examples:
            - "Чтение научной литературы"
        colorHex:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Новый цвет в формате HEX
          examples:
            - "#7C3AED"

    CategoryPatchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Новое название категории
          examples:
            - "Хобби и чтение"
        colorHex:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Новый цвет в формате HEX
          examples:
            - "#9333EA"

    TimeRecord:
      type: object
      required:
        - id
        - userId
        - categoryId
        - startTime
        - description
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор записи
          examples:
            - "44444444-4444-4444-4444-444444444444"
        userId:
          type: string
          format: uuid
          description: Владелец записи
          examples:
            - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        categoryId:
          type: string
          format: uuid
          description: ID привязанной категории
          examples:
            - "11111111-1111-1111-1111-111111111111"
        startTime:
          type: string
          format: date-time
          description: Время начала сессии (ISO-8601)
          examples:
            - "2026-10-15T10:00:00Z"
        endTime:
          type:
            - string
            - "null"
          format: date-time
          description: Время окончания сессии (ISO-8601, null если сессия активна)
          examples:
            - "2026-10-15T10:45:00Z"
        description:
          type: string
          maxLength: 1000
          description: Текстовое описание выполненной активности
          examples:
            - "Проектирование спецификации OpenAPI 3.1"

    TimeRecordCreateRequest:
      type: object
      required:
        - categoryId
        - startTime
        - endTime
        - description
      properties:
        categoryId:
          type: string
          format: uuid
          description: ID категории
          examples:
            - "11111111-1111-1111-1111-111111111111"
        startTime:
          type: string
          format: date-time
          description: Время начала интервала (ISO-8601)
          examples:
            - "2026-10-15T14:00:00Z"
        endTime:
          type: string
          format: date-time
          description: Время окончания интервала (ISO-8601)
          examples:
            - "2026-10-15T15:30:00Z"
        description:
          type: string
          minLength: 1
          maxLength: 1000
          description: Описание активности
          examples:
            - "Разработка API контроллеров и тестов"

    TimeRecordUpdateRequest:
      type: object
      required:
        - categoryId
        - startTime
        - endTime
        - description
      properties:
        categoryId:
          type: string
          format: uuid
          description: ID категории
          examples:
            - "11111111-1111-1111-1111-111111111111"
        startTime:
          type: string
          format: date-time
          description: Время начала интервала
          examples:
            - "2026-10-15T10:00:00Z"
        endTime:
          type: string
          format: date-time
          description: Время окончания интервала
          examples:
            - "2026-10-15T11:00:00Z"
        description:
          type: string
          minLength: 1
          maxLength: 1000
          description: Новое описание
          examples:
            - "Проектирование спецификации OpenAPI 3.1 и ревью методов"

    TimeRecordPatchRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          description: Новый ID категории
          examples:
            - "22222222-2222-2222-2222-222222222222"
        startTime:
          type: string
          format: date-time
          description: Новое время начала
          examples:
            - "2026-10-15T10:05:00Z"
        endTime:
          type: string
          format: date-time
          description: Новое время окончания
          examples:
            - "2026-10-15T10:50:00Z"
        description:
          type: string
          maxLength: 1000
          description: Новое описание (архивирует предыдущий текст в историю)
          examples:
            - "Подготовка ТЗ и согласование контракта REST API"

    PaginatedRecordsResponse:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimeRecord'
        total:
          type: integer
          description: Общее количество записей, удовлетворяющих фильтру
          examples:
            - 42
        limit:
          type: integer
          description: Размер страницы
          examples:
            - 20
        offset:
          type: integer
          description: Текущее смещение
          examples:
            - 0

    ActiveTimerSession:
      type: object
      required:
        - recordId
        - categoryId
        - categoryName
        - colorHex
        - startTime
        - elapsedSeconds
      properties:
        recordId:
          type: string
          format: uuid
          description: Идентификатор активной записи
          examples:
            - "44444444-4444-4444-4444-444444444444"
        categoryId:
          type: string
          format: uuid
          description: Идентификатор категории
          examples:
            - "11111111-1111-1111-1111-111111111111"
        categoryName:
          type: string
          description: Название категории
          examples:
            - "Работа / Проекты"
        colorHex:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Цвет категории
          examples:
            - "#3B82F6"
        startTime:
          type: string
          format: date-time
          description: Время запуска таймера
          examples:
            - "2026-10-15T10:00:00Z"
        elapsedSeconds:
          type: integer
          description: Количество прошедших секунд с момента старта
          examples:
            - 2538

    StartTimerRequest:
      type: object
      required:
        - categoryId
      properties:
        categoryId:
          type: string
          format: uuid
          description: ID категории для трекинга
          examples:
            - "11111111-1111-1111-1111-111111111111"

    StopTimerRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 1000
          description: Опциональное описание завершенной активности
          examples:
            - "Проектирование спецификации OpenAPI 3.1"

    StopTimerResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum: [SAVED, DISCARDED]
          description: Результат завершения сессии (SAVED — сохранена в базу, DISCARDED — длительность менее 1 минуты, сессия аннулирована)
          examples:
            - SAVED
        message:
          type: string
          description: Текстовое пояснение результата операции
          examples:
            - "Сессия таймера успешно сохранена"
        record:
          anyOf:
            - $ref: '#/components/schemas/TimeRecord'
            - type: "null"
          description: Сохраненная запись времени (null, если статус DISCARDED)

    DescriptionVersion:
      type: object
      required:
        - id
        - recordId
        - description
        - modifiedAt
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор исторической версии
          examples:
            - "77777777-7777-7777-7777-777777777777"
        recordId:
          type: string
          format: uuid
          description: Идентификатор записи времени
          examples:
            - "44444444-4444-4444-4444-444444444444"
        description:
          type: string
          description: Исторический текст описания
          examples:
            - "Проектирование архитектуры и C4"
        modifiedAt:
          type: string
          format: date-time
          description: Метка времени, когда описание было изменено и заархивировано
          examples:
            - "2026-10-15T10:20:00Z"

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          examples:
            - "VALIDATION_ERROR"
        message:
          type: string
          description: Понятное человеку описание ошибки
          examples:
            - "Неверный формат входных данных"
        details:
          type: array
          description: Дополнительные детализированные ошибки полей
          items:
            type: string
          examples:
            - ["Поле 'colorHex' должно соответствовать шаблону ^#[0-9A-Fa-f]{6}$"]
        timestamp:
          type: string
          format: date-time
          description: Время возникновения ошибки
          examples:
            - "2026-10-15T10:00:00Z"
