    PaginatedRecordsResponse:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimeRecord'
        total:
          type: integer
          description: Общее количество записей, удовлетворяющих фильтру
          examples:
            - 42
        limit:
          type: integer
          description: Размер страницы
          examples:
            - 20
        offset:
          type: integer
          description: Текущее смещение
          examples:
            - 0

    RecordHistoryEntry:
      type: object
      required:
        - id
        - recordId
        - categoryId
        - startTime
        - description
        - modifiedAt
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор исторического снимка
          examples:
            - "77777777-7777-7777-7777-777777777777"
        recordId:
          type: string
          format: uuid
          description: Идентификатор записи времени
          examples:
            - "44444444-4444-4444-4444-444444444444"
        categoryId:
          type: string
          format: uuid
          description: ID категории на момент создания снимка
          examples:
            - "11111111-1111-1111-1111-111111111111"
        startTime:
          type: string
          format: date-time
          description: Время начала записи на момент создания снимка
          examples:
            - "2026-10-15T10:00:00Z"
        endTime:
          type:
            - string
            - "null"
          format: date-time
          description: Время окончания записи на момент снимка (null если задача была активна)
          examples:
            - "2026-10-15T10:45:00Z"
        description:
          type: string
          description: Текст описания на момент создания снимка
          examples:
            - "Проектирование архитектуры и C4"
        modifiedAt:
          type: string
          format: date-time
          description: Метка времени, когда состояние записи было изменено и заархивировано
          examples:
            - "2026-10-15T10:20:00Z"

    RecordHistoryListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: Список исторических снимков записи
          items:
            $ref: '#/components/schemas/RecordHistoryEntry'

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          examples:
            - "VALIDATION_ERROR"
        message:
          type: string
          description: Понятное человеку описание ошибки
          examples:
            - "Неверный формат входных данных"
        details:
          type: array
          description: Дополнительные детализированные ошибки полей
          items:
            type: string
          examples:
            - ["Поле 'colorHex' должно соответствовать шаблону ^#[0-9A-Fa-f]{6}$"]
        timestamp:
          type: string
          format: date-time
          description: Время возникновения ошибки
          examples:
            - "2026-10-15T10:00:00Z"
