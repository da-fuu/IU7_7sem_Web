openapi: 3.1.0
info:
  title: TimeTracker REST API
  description: |
    REST API сервиса учета времени и продуктивности TimeTracker.

    Основные возможности:
    * Учетные записи и роли пользователей (USER, ADMIN)
    * Ресурсное управление профилями и пользовательскими настройками (/users/{userId}/settings)
    * Гибкие единицы измерения пороговых длительностей (секунды, минуты, часы, дни)
    * Автоматическая остановка зависших сессий по настраиваемому лимиту
    * Управление категориями активностей (системные и пользовательские)
    * Учет записей времени в модели открытых интервалов (endTime = null для текущей активности)
    * Поддержка параллельных активностей и пересекающихся интервалов (multi-tasking)
    * Фильтрация, полное и частичное обновление записей
    * Аудит истории изменений записей (время, категория, описание) и восстановление предыдущих версий
    * Строгая объектная упаковка всех коллекций (свойство items)
  version: 1.1.0
  contact:
    name: TimeTracker Support
    email: support@timetracker.local
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:4010
    description: Локальный Mock-сервер
  - url: http://localhost:8080
    description: Локальный сервер разработки
  - url: http://localhost:80
    description: Шлюз Nginx

tags:
  - name: Auth
    description: Регистрация и аутентификация пользователей
  - name: Users
    description: Управление профилем и пользовательскими настройками
  - name: Categories
    description: Управление категориями активностей
  - name: Records
    description: Управление записями времени и активными задачами
  - name: History
    description: Аудит истории и откат версий записей времени

paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация нового пользователя
      description: Создает нового пользователя в системе и возвращает токен доступа и данные созданного профиля с настройками.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
            examples:
              newUser:
                summary: Регистрация разработчика
                value:
                  login: "alex_dev"
                  name: "Алексей Смирнов"
                  password: "securePassword123"
                  role: "USER"
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                registered:
                  value:
                    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    user:
                      id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      login: "alex_dev"
                      name: "Алексей Смирнов"
                      role: "USER"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Пользователь с таким логином уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                loginConflict:
                  value:
                    code: "USER_ALREADY_EXISTS"
                    message: "Пользователь с логином 'alex_dev' уже зарегистрирован"
                    timestamp: "2026-10-15T10:00:00Z"

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Аутентификация пользователя (получение токена)
      description: Проверяет логин и пароль и возвращает Bearer JWT токен для авторизации запросов.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
            examples:
              validCredentials:
                summary: Корректные учетные данные
                value:
                  login: "alex_dev"
                  password: "securePassword123"
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  value:
                    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    user:
                      id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      login: "alex_dev"
                      name: "Алексей Смирнов"
                      role: "USER"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCreds:
                  value:
                    code: "INVALID_CREDENTIALS"
                    message: "Неверный логин или пароль"
                    timestamp: "2026-10-15T10:00:00Z"

  /api/v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'

    get:
      tags:
        - Users
      summary: Получение профиля пользователя по ID
      description: Возвращает данные профиля пользователя (идентификатор, логин, имя, роль). Доступ разрешен владельцу учетной записи либо администратору (роль ADMIN).
      operationId: getUserById
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль пользователя успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                userProfile:
                  value:
                    id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    login: "alex_dev"
                    name: "Алексей Смирнов"
                    role: "USER"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/users/{userId}/settings:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'

    get:
      tags:
        - Users
      summary: Получение настроек пользователя
      description: Возвращает индивидуальные настройки трекера (пороги длительностей, единицы измерения, авто-остановку) для указанного пользователя.
      operationId: getUserSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Настройки пользователя успешно получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
              examples:
                currentSettings:
                  value:
                    autoStopEnabled: true
                    maxActiveDurationValue: 8
                    maxActiveDurationUnit: "hours"
                    minDurationEnabled: true
                    minDurationValue: 1
                    minDurationUnit: "minutes"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
        - Users
      summary: Частичное обновление настроек пользователя
      description: Обновляет выбранные параметры трекера пользователя. Доступ разрешен владельцу либо администратору.
      operationId: updateUserSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpdateRequest'
            examples:
              customUnits:
                summary: Настройка секундного порога и 12-часового лимита
                value:
                  autoStopEnabled: true
                  maxActiveDurationValue: 12
                  maxActiveDurationUnit: "hours"
                  minDurationEnabled: false
                  minDurationValue: 30
                  minDurationUnit: "seconds"
      responses:
        '200':
          description: Настройки пользователя успешно обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
              examples:
                updatedSettings:
                  value:
                    autoStopEnabled: true
                    maxActiveDurationValue: 12
                    maxActiveDurationUnit: "hours"
                    minDurationEnabled: false
                    minDurationValue: 30
                    minDurationUnit: "seconds"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/categories:
    get:
      tags:
        - Categories
      summary: Список доступных категорий
      description: Возвращает словарь с перечнем базовых категорий системы и личных категорий текущего пользователя в свойстве items.
      operationId: listCategories
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          description: Фильтр области видимости категорий
          schema:
            type: string
            enum: [all, default, custom]
            default: all
            examples:
              - all
      responses:
        '200':
          description: Список категорий успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
              examples:
                categoriesList:
                  value:
                    items:
                      - id: "11111111-1111-1111-1111-111111111111"
                        userId: null
                        name: "Работа / Проекты"
                        colorHex: "#3B82F6"
                        isDefault: true
                      - id: "22222222-2222-2222-2222-222222222222"
                        userId: null
                        name: "Спорт и здоровье"
                        colorHex: "#10B981"
                        isDefault: true
                      - id: "33333333-3333-3333-3333-333333333333"
                        userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        name: "Чтение книг"
                        colorHex: "#8B5CF6"
                        isDefault: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Categories
      summary: Создание новой категории
      description: |
        Создает категорию.
        * Обычный пользователь создает личную категорию (isDefault = false, userId устанавливается автоматически).
        * Создание базовой категории (isDefault = true) разрешено только пользователям с ролью ADMIN.
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
            examples:
              userCategory:
                summary: Личная категория
                value:
                  name: "Английский язык"
                  colorHex: "#EC4899"
                  isDefault: false
      responses:
        '201':
          description: Категория успешно создана
          headers:
            Location:
              description: Ссылка на созданный ресурс
              schema:
                type: string
                examples:
                  - "/api/v1/categories/55555555-5555-5555-5555-555555555555"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              examples:
                created:
                  value:
                    id: "55555555-5555-5555-5555-555555555555"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Английский язык"
                    colorHex: "#EC4899"
                    isDefault: false
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Попытка создания базовой категории без роли ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                adminRequired:
                  value:
                    code: "FORBIDDEN"
                    message: "Создание базовых категорий разрешено только администраторам"
                    timestamp: "2026-10-15T10:00:00Z"
        '409':
          description: Категория с таким именем уже существует у пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                nameConflict:
                  value:
                    code: "CATEGORY_ALREADY_EXISTS"
                    message: "Категория с именем 'Английский язык' уже существует"
                    timestamp: "2026-10-15T10:00:00Z"

  /api/v1/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryIdParam'

    get:
      tags:
        - Categories
      summary: Получение деталей категории по ID
      description: Возвращает категорию по идентификатору. Доступ разрешен, если категория базовая или принадлежит текущему пользователю.
      operationId: getCategoryById
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Категория найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              examples:
                categoryDetails:
                  value:
                    id: "11111111-1111-1111-1111-111111111111"
                    userId: null
                    name: "Работа / Проекты"
                    colorHex: "#3B82F6"
                    isDefault: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Categories
      summary: Полное обновление категории (PUT)
      description: |
        Полная замена полей категории (идемпотентная операция).
        Требует передачи всех обязательных полей (name, colorHex).
        Редактирование базовых категорий разрешено только администраторам.
      operationId: updateCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
            examples:
              fullUpdate:
                value:
                  name: "Научная работа и публикации"
                  colorHex: "#2563EB"
      responses:
        '200':
          description: Категория успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              examples:
                updated:
                  value:
                    id: "33333333-3333-3333-3333-333333333333"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Научная работа и публикации"
                    colorHex: "#2563EB"
                    isDefault: false
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Новое имя категории совпадает с уже существующим
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Categories
      summary: Частичное обновление категории (PATCH)
      description: Частичное изменение атрибутов категории (например, только цвета или только названия).
      operationId: patchCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatchRequest'
            examples:
              changeColorOnly:
                summary: Обновление только цвета
                value:
                  colorHex: "#059669"
      responses:
        '200':
          description: Категория успешно изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              examples:
                patched:
                  value:
                    id: "33333333-3333-3333-3333-333333333333"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Чтение книг"
                    colorHex: "#059669"
                    isDefault: false
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Имя конфликтует с существующей категорией
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Categories
      summary: Удаление категории
      description: |
        Удаляет категорию. Базовые категории может удалять только ADMIN.
        Связанные записи времени сохраняются, при необходимости категория обнуляется или переназначается.
      operationId: deleteCategory
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Категория успешно удалена (нет тела ответа)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/records:
    get:
      tags:
        - Records
      summary: Список записей времени с фильтрацией и пагинацией
      description: |
        Возвращает перечень записей времени пользователя в объекте со свойством items.
        Поддерживает фильтрацию по статусу активности (status=active для незавершенных задач, completed для завершенных, all для всех), датам и категории.
      operationId: listRecords
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Фильтр по состоянию активности задачи
          schema:
            type: string
            enum: [all, active, completed]
            default: all
            examples:
              - all
        - name: from
          in: query
          required: false
          description: Начальная дата/время фильтра (ISO-8601)
          schema:
            type: string
            format: date-time
            examples:
              - "2026-10-15T00:00:00Z"
        - name: to
          in: query
          required: false
          description: Конечная дата/время фильтра (ISO-8601)
          schema:
            type: string
            format: date-time
            examples:
              - "2026-10-15T23:59:59Z"
        - name: categoryId
          in: query
          required: false
          description: Фильтр по ID категории
          schema:
            type: string
            format: uuid
            examples:
              - "11111111-1111-1111-1111-111111111111"
        - name: limit
          in: query
          required: false
          description: Максимальное количество записей в ответе
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            examples:
              - 20
        - name: offset
          in: query
          required: false
          description: Смещение выборки (пагинация)
          schema:
            type: integer
            minimum: 0
            default: 0
            examples:
              - 0
      responses:
        '200':
          description: Страница записей времени успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecordsResponse'
              examples:
                recordsPage:
                  value:
                    items:
                      - id: "44444444-4444-4444-4444-444444444444"
                        userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        categoryId: "11111111-1111-1111-1111-111111111111"
                        startTime: "2026-10-15T10:00:00Z"
                        endTime: null
                        description: "Разработка архитектурного плана и контракта"
                      - id: "66666666-6666-6666-6666-666666666666"
                        userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        categoryId: "11111111-1111-1111-1111-111111111111"
                        startTime: "2026-10-15T08:00:00Z"
                        endTime: "2026-10-15T09:30:00Z"
                        description: "Код-ревью и согласование моделей"
                    total: 2
                    limit: 20
                    offset: 0
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Records
      summary: Создание записи времени или запуск активной задачи
      description: |
        Создает запись активности пользователя.
        * Если поле endTime не передано или равно null — запускается активная задача.
        * Разрешено одновременное существование нескольких активных задач (multi-tasking).
        * Разрешено создание пересекающихся по времени записей.
        * Если endTime задан, проверяется корректность интервала (endTime > startTime) и соблюдение минимального порога длительности (если включен в настройках).
      operationId: createRecord
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeRecordCreateRequest'
            examples:
              startActiveTask:
                summary: Запуск активной задачи (без endTime)
                value:
                  categoryId: "11111111-1111-1111-1111-111111111111"
                  description: "Разработка новой схемы REST API"
              completedRecord:
                summary: Готовая запись с известным интервалом
                value:
                  categoryId: "11111111-1111-1111-1111-111111111111"
                  startTime: "2026-10-15T14:00:00Z"
                  endTime: "2026-10-15T15:30:00Z"
                  description: "Разработка API контроллеров и тестов"
      responses:
        '201':
          description: Запись времени успешно создана
          headers:
            Location:
              description: Ссылка на созданную запись
              schema:
                type: string
                examples:
                  - "/api/v1/records/66666666-6666-6666-6666-666666666666"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecord'
              examples:
                created:
                  value:
                    id: "66666666-6666-6666-6666-666666666666"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    categoryId: "11111111-1111-1111-1111-111111111111"
                    startTime: "2026-10-15T14:00:00Z"
                    endTime: "2026-10-15T15:30:00Z"
                    description: "Разработка API контроллеров и тестов"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Категория не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Нарушение условий интервала (endTime <= startTime или длительность менее минимального порога)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInterval:
                  value:
                    code: "INVALID_TIME_RANGE"
                    message: "Время окончания должно быть строго позже времени начала"
                    timestamp: "2026-10-15T10:00:00Z"
                tooShort:
                  value:
                    code: "DURATION_TOO_SHORT"
                    message: "Длительность записи менее установленного минимального порога"
                    timestamp: "2026-10-15T10:00:00Z"

  /api/v1/records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/RecordIdParam'

    get:
      tags:
        - Records
      summary: Получение записи времени по ID
      description: Возвращает данные конкретной записи времени. Доступ разрешен только владельцу записи либо администратору.
      operationId: getRecordById
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Запись времени найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecord'
              examples:
                recordData:
                  value:
                    id: "44444444-4444-4444-4444-444444444444"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    categoryId: "11111111-1111-1111-1111-111111111111"
                    startTime: "2026-10-15T10:00:00Z"
                    endTime: "2026-10-15T10:45:00Z"
                    description: "Проектирование спецификации OpenAPI 3.1"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Records
      summary: Полное обновление записи времени (PUT)
      description: |
        Полная замена полей записи времени (идемпотентная операция).
        При изменении любых атрибутов записи (startTime, endTime, categoryId, description) предыдущее состояние автоматически фиксируется в истории изменений.
      operationId: updateRecord
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeRecordUpdateRequest'
            examples:
              fullUpdate:
                value:
                  categoryId: "11111111-1111-1111-1111-111111111111"
                  startTime: "2026-10-15T10:00:00Z"
                  endTime: "2026-10-15T11:00:00Z"
                  description: "Проектирование спецификации OpenAPI 3.1 и ревью методов"
      responses:
        '200':
          description: Запись времени успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecord'
              examples:
                updated:
                  value:
                    id: "44444444-4444-4444-4444-444444444444"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    categoryId: "11111111-1111-1111-1111-111111111111"
                    startTime: "2026-10-15T10:00:00Z"
                    endTime: "2026-10-15T11:00:00Z"
                    description: "Проектирование спецификации OpenAPI 3.1 и ревью методов"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: Ошибка валидации временного интервала
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Records
      summary: Частичное обновление записи времени или остановка задачи (PATCH)
      description: |
        Частичное изменение полей записи времени (даты, категории или описания).
        * Простановка endTime в активную задачу переводит её в статус завершенной.
        * При изменении любых полей текущее состояние автоматически архивируется в виде снимка в истории изменений.
      operationId: patchRecord
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeRecordPatchRequest'
            examples:
              stopActiveTask:
                summary: Завершение активной задачи (простановка endTime)
                value:
                  endTime: "2026-10-15T10:45:00Z"
              updateTimeInterval:
                summary: Корректировка начала и окончания
                value:
                  startTime: "2026-10-15T10:05:00Z"
                  endTime: "2026-10-15T10:50:00Z"
              changeDescription:
                summary: Изменение текста описания
                value:
                  description: "Подготовка ТЗ и согласование контракта REST API"
      responses:
        '200':
          description: Запись времени успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecord'
              examples:
                updated:
                  value:
                    id: "44444444-4444-4444-4444-444444444444"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    categoryId: "11111111-1111-1111-1111-111111111111"
                    startTime: "2026-10-15T10:00:00Z"
                    endTime: "2026-10-15T10:45:00Z"
                    description: "Подготовка ТЗ и согласование контракта REST API"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: Ошибка валидации временных рамок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Records
      summary: Удаление записи времени
      description: Удаляет запись времени и связанные исторические версии (каскадно).
      operationId: deleteRecord
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Запись успешно удалена
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/records/{recordId}/history:
    parameters:
      - $ref: '#/components/parameters/RecordIdParam'

    get:
      tags:
        - History
      summary: Просмотр истории версий записи времени
      description: Возвращает хронологический перечень всех предыдущих снимков указанной записи времени (время, категория, описание) в свойстве items.
      operationId: getRecordHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: История изменений записи получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordHistoryListResponse'
              examples:
                historyList:
                  value:
                    items:
                      - id: "77777777-7777-7777-7777-777777777777"
                        recordId: "44444444-4444-4444-4444-444444444444"
                        categoryId: "11111111-1111-1111-1111-111111111111"
                        startTime: "2026-10-15T10:00:00Z"
                        endTime: "2026-10-15T10:45:00Z"
                        description: "Проектирование архитектуры и C4"
                        modifiedAt: "2026-10-15T10:20:00Z"
                      - id: "88888888-8888-8888-8888-888888888888"
                        recordId: "44444444-4444-4444-4444-444444444444"
                        categoryId: "11111111-1111-1111-1111-111111111111"
                        startTime: "2026-10-15T10:00:00Z"
                        endTime: null
                        description: "Начальное описание задачи"
                        modifiedAt: "2026-10-15T10:05:00Z"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/records/{recordId}/history/{versionId}/rollback:
    parameters:
      - $ref: '#/components/parameters/RecordIdParam'
      - name: versionId
        in: path
        required: true
        description: Уникальный идентификатор исторической версии записи для отката
        schema:
          type: string
          format: uuid
        examples:
          sampleVersion:
            value: "88888888-8888-8888-8888-888888888888"

    post:
      tags:
        - History
      summary: Восстановление состояния записи из истории
      description: |
        Восстанавливает поля записи (startTime, endTime, categoryId, description) из указанного исторического снимка.
        Текущее состояние записи перед применением изменений архивируется в историю как новый снимок (Forward-only audit).
      operationId: rollbackRecordVersion
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Запись успешно откачена к целевой версии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRecord'
              examples:
                restoredRecord:
                  value:
                    id: "44444444-4444-4444-4444-444444444444"
                    userId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    categoryId: "11111111-1111-1111-1111-111111111111"
                    startTime: "2026-10-15T10:00:00Z"
                    endTime: "2026-10-15T10:45:00Z"
                    description: "Проектирование архитектуры и C4"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Запись или указанная версия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                versionNotFound:
                  value:
                    code: "VERSION_NOT_FOUND"
                    message: "Историческая версия с ID '88888888-8888-8888-8888-888888888888' не найдена"
                    timestamp: "2026-10-15T10:00:00Z"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен авторизации в формате `Bearer <token>`

  parameters:
    UserIdParam:
      name: userId
      in: path
      required: true
      description: Уникальный идентификатор пользователя (UUID)
      schema:
        type: string
        format: uuid
      examples:
        defaultUser:
          value: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    CategoryIdParam:
      name: categoryId
      in: path
      required: true
      description: Уникальный идентификатор категории
      schema:
        type: string
        format: uuid
      examples:
        sampleCategory:
          value: "33333333-3333-3333-3333-333333333333"

    RecordIdParam:
      name: recordId
      in: path
      required: true
      description: Уникальный идентификатор записи времени
      schema:
        type: string
        format: uuid
      examples:
        sampleRecord:
          value: "44444444-4444-4444-4444-444444444444"

  responses:
    BadRequestError:
      description: Некорректный синтаксис запроса или ошибка валидации полей
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              value:
                code: "BAD_REQUEST"
                message: "Некорректный формат входных данных"
                timestamp: "2026-10-15T10:00:00Z"

    UnauthorizedError:
      description: Отсутствует или недействителен токен авторизации (Bearer JWT)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                code: "UNAUTHORIZED"
                message: "Требуется авторизация в системе"
                timestamp: "2026-10-15T10:00:00Z"

    ForbiddenError:
      description: Недостаточно прав для выполнения операции (попытка изменения чужого ресурса или управление базовыми категориями без роли ADMIN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                code: "FORBIDDEN"
                message: "Недостаточно прав для выполнения действия"
                timestamp: "2026-10-15T10:00:00Z"

    NotFoundError:
      description: Запрашиваемый ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                code: "RESOURCE_NOT_FOUND"
                message: "Запрашиваемый ресурс не найден"
                timestamp: "2026-10-15T10:00:00Z"

  schemas:
    DurationUnit:
      type: string
      enum:
        - seconds
        - minutes
        - hours
        - days
      description: Единица измерения продолжительности времени
      examples:
        - minutes

    UserSettings:
      type: object
      required:
        - autoStopEnabled
        - maxActiveDurationValue
        - maxActiveDurationUnit
        - minDurationEnabled
        - minDurationValue
        - minDurationUnit
      properties:
        autoStopEnabled:
          type: boolean
          description: Флаг автоматической остановки активных задач при превышении максимальной длительности
          examples:
            - true
        maxActiveDurationValue:
          type: integer
          minimum: 1
          description: Числовое значение максимальной длительности активной задачи
          examples:
            - 8
        maxActiveDurationUnit:
          $ref: '#/components/schemas/DurationUnit'
          examples:
            - hours
        minDurationEnabled:
          type: boolean
          description: Флаг отклонения записей короче установленного минимального порога
          examples:
            - true
        minDurationValue:
          type: integer
          minimum: 1
          description: Числовое значение минимальной длительности сохраняемой записи
          examples:
            - 1
        minDurationUnit:
          $ref: '#/components/schemas/DurationUnit'
          examples:
            - minutes

    UserSettingsUpdateRequest:
      type: object
      properties:
        autoStopEnabled:
          type: boolean
          description: Флаг автоматической остановки активных задач
          examples:
            - true
        maxActiveDurationValue:
          type: integer
          minimum: 1
          description: Числовое значение максимальной длительности
          examples:
            - 12
        maxActiveDurationUnit:
          $ref: '#/components/schemas/DurationUnit'
          examples:
            - hours
        minDurationEnabled:
          type: boolean
          description: Флаг проверки минимальной длительности
          examples:
            - false
        minDurationValue:
          type: integer
          minimum: 1
          description: Числовое значение минимальной длительности
          examples:
            - 30
        minDurationUnit:
          $ref: '#/components/schemas/DurationUnit'
          examples:
            - seconds

    User:
      type: object
      required:
        - id
        - login
        - name
        - role
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор пользователя
          examples:
            - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        login:
          type: string
          minLength: 3
          maxLength: 50
          description: Уникальный логин пользователя
          examples:
            - "alex_dev"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Отображаемое имя пользователя
          examples:
            - "Алексей Смирнов"
        role:
          type: string
          enum: [USER, ADMIN]
          description: Роль пользователя в системе
          examples:
            - "USER"

    UserRegistrationRequest:
      type: object
      required:
        - login
        - name
        - password
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-zA-Z0-9_.-]+$"
          description: Логин (латиница, цифры, дефис, точка)
          examples:
            - "alex_dev"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Имя пользователя
          examples:
            - "Алексей Смирнов"
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 128
          description: Пароль учетной записи
          examples:
            - "securePassword123"
        role:
          type: string
          enum: [USER, ADMIN]
          default: USER
          description: Желаемая роль пользователя (по умолчанию USER)
          examples:
            - "USER"

    UserLoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          description: Логин пользователя
          examples:
            - "alex_dev"
        password:
          type: string
          format: password
          minLength: 1
          description: Пароль пользователя
          examples:
            - "securePassword123"

    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: JWT Access Token для авторизации последующих запросов
          examples:
            - "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/User'

    Category:
      type: object
      required:
        - id
        - name
        - colorHex
        - isDefault
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор категории
          examples:
            - "33333333-3333-3333-3333-333333333333"
        userId:
          type:
            - string
            - "null"
          format: uuid
          description: Идентификатор владельца (null для глобальных базовых категорий)
          examples:
            - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Название категории
          examples:
            - "Чтение книг"
        colorHex:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Цвет категории в формате HEX (#RRGGBB)
          examples:
            - "#8B5CF6"
        isDefault:
          type: boolean
          description: Признак базовой категории системы
          examples:
            - false

    CategoryListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: Список категорий
          items:
            $ref: '#/components/schemas/Category'

    CategoryCreateRequest:
      type: object
      required:
        - name
        - colorHex
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Название категории
          examples:
            - "Чтение книг"
        colorHex:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Цвет категории в формате HEX (#RRGGBB)
          examples:
            - "#8B5CF6"
        isDefault:
          type: boolean
          default: false
          description: Флаг базовой категории (разрешено устанавливать в true только администраторам)
          examples:
            - false

    CategoryUpdateRequest:
      type: object
      required:
        - name
        - colorHex
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Новое название категории
          examples:
            - "Чтение научной литературы"
        colorHex:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Новый цвет в формате HEX
          examples:
            - "#7C3AED"

    CategoryPatchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Новое название категории
          examples:
            - "Хобби и чтение"
        colorHex:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Новый цвет в формате HEX
          examples:
            - "#9333EA"

    TimeRecord:
      type: object
      required:
        - id
        - userId
        - categoryId
        - startTime
        - description
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор записи
          examples:
            - "44444444-4444-4444-4444-444444444444"
        userId:
          type: string
          format: uuid
          description: Владелец записи
          examples:
            - "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        categoryId:
          type: string
          format: uuid
          description: ID привязанной категории
          examples:
            - "11111111-1111-1111-1111-111111111111"
        startTime:
          type: string
          format: date-time
          description: Время начала активности (ISO-8601)
          examples:
            - "2026-10-15T10:00:00Z"
        endTime:
          type:
            - string
            - "null"
          format: date-time
          description: Время окончания активности (ISO-8601, null если задача активна)
          examples:
            - "2026-10-15T10:45:00Z"
        description:
          type: string
          maxLength: 1000
          description: Текстовое описание выполненной активности
          examples:
            - "Проектирование спецификации OpenAPI 3.1"

    TimeRecordCreateRequest:
      type: object
      required:
        - categoryId
      properties:
        categoryId:
          type: string
          format: uuid
          description: ID категории
          examples:
            - "11111111-1111-1111-1111-111111111111"
        startTime:
          type: string
          format: date-time
          description: Время начала активности (ISO-8601, по умолчанию текущее серверное время)
          examples:
            - "2026-10-15T14:00:00Z"
        endTime:
          type:
            - string
            - "null"
          format: date-time
          description: Время окончания (ISO-8601, null или не передано для старта активной задачи)
          examples:
            - "2026-10-15T15:30:00Z"
        description:
          type: string
          maxLength: 1000
          default: ""
          description: Описание активности
          examples:
            - "Разработка API контроллеров и тестов"

    TimeRecordUpdateRequest:
      type: object
      required:
        - categoryId
        - startTime
        - description
      properties:
        categoryId:
          type: string
          format: uuid
          description: ID категории
          examples:
            - "11111111-1111-1111-1111-111111111111"
        startTime:
          type: string
          format: date-time
          description: Время начала активности
          examples:
            - "2026-10-15T10:00:00Z"
        endTime:
          type:
            - string
            - "null"
          format: date-time
          description: Время окончания активности (null если активность продолжается)
          examples:
            - "2026-10-15T11:00:00Z"
        description:
          type: string
          maxLength: 1000
          description: Описание активности
          examples:
            - "Проектирование спецификации OpenAPI 3.1 и ревью методов"

    TimeRecordPatchRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          description: Новый ID категории
          examples:
            - "22222222-2222-2222-2222-222222222222"
        startTime:
          type: string
          format: date-time
          description: Новое время начала активности
          examples:
            - "2026-10-15T10:05:00Z"
        endTime:
          type:
            - string
            - "null"
          format: date-time
          description: Новое время окончания (установка значения фиксирует завершение активности)
          examples:
