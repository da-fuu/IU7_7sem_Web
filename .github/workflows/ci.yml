name: Testing lab 2
on:
  push:
  workflow_dispatch:
env:
  TEST_CLIENT_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
  COMPOSE_PROJECT_NAME: lab2-ci-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  tests:
    runs-on: [self-hosted, Linux, X64, timetracker-lab2]
    outputs:
      pages_artifact: ${{ steps.pages_upload.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Set container user
        run: |
          echo "TEST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "TEST_GID=$(id -g)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: .allure-history
          key: allure-history-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: allure-history-${{ github.ref }}-
      - name: Prepare results
        run: |
          mkdir -p build/allure-results
          if [ -d .allure-history ]; then cp -r .allure-history build/allure-results/history; fi
      - name: Build test runner
        run: docker compose -f deploy/test/docker-compose.test.yml -f deploy/test/docker-compose.ci.yml build test-runner
      - name: Prepare persistent Gradle caches
        run: |
          docker volume create timetracker-lab2-ci-gradle-cache
          docker volume create timetracker-lab2-ci-project-cache
          docker compose -f deploy/test/docker-compose.test.yml -f deploy/test/docker-compose.ci.yml run --rm --no-deps --user 0 --entrypoint sh test-runner -c "chown $TEST_UID:$TEST_GID /gradle /workspace/.gradle"
      - name: Unit tests and backend build
        id: unit
        run: docker compose -f deploy/test/docker-compose.test.yml -f deploy/test/docker-compose.ci.yml run --rm test-runner ./gradlew test :web:backend:jar
      - name: Integration tests
        id: integration
        env:
          POSTGRES_TEST_HOST: ${{ vars.POSTGRES_TEST_HOST || '127.0.0.1' }}
          POSTGRES_TEST_PORT: ${{ vars.POSTGRES_TEST_PORT || '55432' }}
          POSTGRES_TEST_DB: ${{ vars.POSTGRES_TEST_DB || 'timetracker_test' }}
          POSTGRES_TEST_USER: ${{ vars.POSTGRES_TEST_USER || 'timetracker_test' }}
          POSTGRES_TEST_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD || 'timetracker_test_pass' }}
        run: |
          for setting in POSTGRES_TEST_HOST POSTGRES_TEST_DB POSTGRES_TEST_USER POSTGRES_TEST_PASSWORD; do
            if [ -z "${!setting}" ]; then
              echo "::error::Configure ${setting} for the shared PostgreSQL test stand"
              exit 1
            fi
          done
          docker compose -f deploy/test/docker-compose.test.yml -f deploy/test/docker-compose.ci.yml -f deploy/test/docker-compose.shared-runner.yml run --rm test-runner ./gradlew integrationTest
      - name: Check shared backend and cleanup service
        id: backend_check
        env:
          SERVER_URL: ${{ vars.SHARED_BACKEND_URL || 'http://127.0.0.1:18081' }}
        run: |
          test "$(docker compose -p timetracker-lab2-shared -f deploy/test/docker-compose.shared.yml ps --status running -q cleanup | wc -l)" -eq 1
          deployed_hash=$(docker compose -p timetracker-lab2-shared -f deploy/test/docker-compose.shared.yml exec -T backend sha256sum /app/app.jar | cut -d ' ' -f1)
          expected_hash=$(sha256sum web/backend/build/libs/backend.jar | cut -d ' ' -f1)
          cleanup_hash=$(docker compose -p timetracker-lab2-shared -f deploy/test/docker-compose.shared.yml exec -T cleanup sha256sum /e2e_control.py | cut -d ' ' -f1)
          expected_cleanup_hash=$(sha256sum deploy/test/scripts/e2e_control.py | cut -d ' ' -f1)
          if [ "$cleanup_hash" != "$expected_cleanup_hash" ]; then
            echo "::error::Shared cleanup service differs from this checkout; redeploy it when no other tests are running"
            exit 1
          fi
          if [ "$deployed_hash" != "$expected_hash" ]; then
            echo "::error::Shared backend differs from this checkout; redeploy it when no other tests are running"
            exit 1
          fi
          curl -fsS "${SERVER_URL:-http://127.0.0.1:18081}/health"
      - name: E2E test
        id: e2e
        env:
          POSTGRES_TEST_HOST: ${{ vars.POSTGRES_TEST_HOST || '127.0.0.1' }}
          POSTGRES_TEST_PORT: ${{ vars.POSTGRES_TEST_PORT || '55432' }}
          POSTGRES_TEST_DB: ${{ vars.POSTGRES_TEST_DB || 'timetracker_test' }}
          POSTGRES_TEST_USER: ${{ vars.POSTGRES_TEST_USER || 'timetracker_test' }}
          POSTGRES_TEST_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD || 'timetracker_test_pass' }}
          SERVER_URL: ${{ vars.SHARED_BACKEND_URL || 'http://127.0.0.1:18081' }}
        run: docker compose -f deploy/test/docker-compose.test.yml -f deploy/test/docker-compose.ci.yml -f deploy/test/docker-compose.shared-runner.yml run --rm test-runner python3 deploy/test/scripts/e2e_control.py run -- ./gradlew e2eTest
      - name: Mark unexecuted stages
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend_check.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: python3 scripts/generate_skipped_results.py build/allure-results
      - name: Add test results to Actions summary
        if: always()
        run: python3 scripts/write_ci_test_summary.py
      - name: Identify run for Allure trends
        if: always()
        run: python3 scripts/write_allure_executor.py
      - name: Generate report
        id: report
        if: always()
        run: docker compose -f deploy/test/docker-compose.test.yml -f deploy/test/docker-compose.ci.yml run --rm --no-deps test-runner ./gradlew allureReport
      - name: Save history
        if: always()
        run: if [ -d build/reports/allure-report/history ]; then mkdir -p .allure-history; cp -r build/reports/allure-report/history/. .allure-history/; fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .allure-history
          key: allure-history-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: build/reports/allure-report
      - name: Stage local Allure report
        if: always() && steps.report.outcome == 'success'
        env:
          ALLURE_LOCAL_REPORT_DIR: ${{ vars.ALLURE_LOCAL_REPORT_DIR || '/home/dafuu/IU7_7sem_Web/.local/actions-runner/reports' }}
        run: ./scripts/stage_local_allure_report.sh
      - name: Prepare Allure for GitHub Pages
        id: pages_upload
        if: always() && steps.report.outcome == 'success' && (github.ref_name == 'tests_02' || github.ref_name == github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/reports/allure-report
      - name: Remove isolated test environment
        if: always()
        run: docker compose -f deploy/test/docker-compose.test.yml -f deploy/test/docker-compose.ci.yml down -v --remove-orphans

  publish-report:
    if: always() && needs.tests.outputs.pages_artifact == 'success'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Allure report
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Add report link to Actions summary
        run: echo "[Open Allure report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
